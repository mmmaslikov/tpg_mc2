<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Мастер-класс: Педагогический замысел в цифре</title>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-2: #f4f4f5;
    --surface-3: #e4e4e7;
    --fg: #09090b;
    --fg-2: #27272a;
    --muted: #71717a;
    --muted-2: #a1a1aa;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --accent-2: #1d4ed8;
    --success: #059669;
    --success-soft: #d1fae5;
    --warn: #d97706;
    --warn-soft: #fef3c7;
    --violet: #7c3aed;
    --violet-soft: #ede9fe;
    --radius-sm: 10px;
    --radius: 14px;
    --radius-lg: 18px;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow: 0 4px 14px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
    --shadow-lg: 0 20px 40px -12px rgba(15, 23, 42, 0.12);
    --font: system-ui, -apple-system, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --container: 1120px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }

  ::selection { background: var(--accent-soft); color: var(--accent-2); }

  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  input, textarea { font: inherit; color: inherit; }

  code {
    font-family: inherit;
    font-size: inherit;
    font-weight: 500;
  }

  .progress-bar {
    position: fixed; top: 0; left: 0; height: 2px; width: 0%;
    background: var(--accent); z-index: 100; transition: width 0.1s linear;
  }

  .nav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(250, 250, 250, 0.85);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    max-width: var(--container); margin: 0 auto;
    padding: 14px 20px;
    display: flex; align-items: center; gap: 16px;
  }
  .nav-brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; font-size: 14px; letter-spacing: -0.01em;
    color: var(--fg);
  }
  .nav-logo {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #6366f1);
    display: grid; place-items: center;
    color: white; font-weight: 700; font-size: 12px;
    box-shadow: var(--shadow-sm);
  }
  .nav-links {
    display: flex; gap: 4px; margin-left: auto;
    overflow-x: auto; scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .nav-links::-webkit-scrollbar { display: none; }
  .nav-link {
    padding: 8px 12px; border-radius: 8px;
    font-size: 13px; color: var(--muted);
    white-space: nowrap; transition: all 0.15s;
    font-weight: 500;
  }
  .nav-link:hover { color: var(--fg); background: var(--surface-2); text-decoration: none; }
  .nav-link.active { color: var(--accent-2); background: var(--accent-soft); }
  .nav-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .container { max-width: var(--container); margin: 0 auto; padding: 0 20px; }
  section { padding: 72px 0; scroll-margin-top: 72px; }
  section + section { border-top: 1px solid var(--border); }

  .hero { padding: 80px 0 40px; }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 12px; color: var(--muted); font-weight: 500;
    margin-bottom: 20px;
  }
  .hero-eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--success); box-shadow: 0 0 0 3px var(--success-soft);
  }
  .hero h1 {
    font-size: clamp(32px, 5.5vw, 52px);
    line-height: 1.05; letter-spacing: -0.03em;
    font-weight: 700; margin: 0 0 16px;
    color: var(--fg);
  }
  .hero h1 .accent {
    background: linear-gradient(135deg, var(--accent), #6366f1);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero-sub {
    font-size: clamp(16px, 2vw, 19px);
    color: var(--muted); max-width: 720px;
    line-height: 1.5; margin: 0 0 32px;
  }

  .section-head { margin-bottom: 40px; }
  .section-num {
    display: inline-block;
    font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--accent);
    margin-bottom: 10px;
  }
  .section-title {
    font-size: clamp(26px, 4vw, 36px);
    font-weight: 700; letter-spacing: -0.02em;
    line-height: 1.15; margin: 0 0 12px;
  }
  .section-lead {
    font-size: 17px; color: var(--muted); max-width: 720px;
    line-height: 1.55; margin: 0;
  }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 24px;
    transition: all 0.2s;
  }
  .card:hover { box-shadow: var(--shadow); }

  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }

  .pipeline {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
    margin-top: 24px;
    position: relative;
  }
  .pipeline::before {
    content: '';
    position: absolute;
    top: 28px;
    left: 8%;
    right: 8%;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--violet));
    opacity: 0.3;
    z-index: 0;
  }
  .pipe-step {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 14px;
    text-align: center;
    position: relative;
    z-index: 1;
    transition: all 0.25s;
  }
  .pipe-step:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: var(--shadow);
  }
  .pipe-num {
    width: 36px; height: 36px;
    margin: 0 auto 10px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #6366f1);
    color: white;
    display: grid; place-items: center;
    font-weight: 700; font-size: 14px;
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
  }
  .pipe-title {
    font-size: 14px; font-weight: 600; color: var(--fg);
    margin-bottom: 4px;
  }
  .pipe-desc {
    font-size: 12px; color: var(--muted); line-height: 1.4;
  }

  .example-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    margin-top: 24px;
  }
  .example-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    transition: all 0.25s;
    display: flex;
    flex-direction: column;
  }
  .example-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-lg);
    border-color: var(--accent);
  }
  .example-screenshot {
    aspect-ratio: 16 / 10;
    background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }
  .example-screenshot::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg, transparent 48%, rgba(37,99,235,0.04) 49%, rgba(37,99,235,0.04) 51%, transparent 52%),
      linear-gradient(45deg, transparent 48%, rgba(37,99,235,0.04) 49%, rgba(37,99,235,0.04) 51%, transparent 52%);
    background-size: 20px 20px;
    z-index: 0;
  }
  .example-screenshot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    position: relative;
    z-index: 1;
  }
  .example-body {
    padding: 16px 18px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .example-title {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--fg);
    margin-bottom: 6px;
    line-height: 1.35;
  }
  .example-link {
    font-size: 12.5px;
    color: var(--accent);
    word-break: break-all;
    margin-top: auto;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .prompt-intro {
    background: linear-gradient(135deg, #f0f9ff 0%, #eef2ff 100%);
    border: 1px solid #bfdbfe;
    border-radius: var(--radius-lg);
    padding: 24px;
    margin-bottom: 24px;
  }
  .prompt-intro-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }
  .prompt-intro-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--violet));
    color: white;
    display: grid; place-items: center;
    box-shadow: var(--shadow-sm);
  }
  .prompt-intro-title {
    font-size: 17px; font-weight: 600; color: var(--fg);
  }
  .prompt-intro-text {
    font-size: 14.5px; color: var(--fg-2); line-height: 1.6;
  }
  .prompt-intro-text a {
    font-weight: 500;
  }

  .prompt-editor {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    margin-top: 20px;
  }
  .prompt-editor-title {
    font-size: 16px; font-weight: 600; color: var(--fg);
    margin-bottom: 6px;
  }
  .prompt-editor-subtitle {
    font-size: 13.5px; color: var(--muted);
    margin-bottom: 20px;
  }
  .prompt-field {
    margin-bottom: 16px;
  }
  .prompt-field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
    margin-bottom: 6px;
  }
  .prompt-field label .hint {
    font-weight: 400;
    color: var(--muted);
    font-size: 12.5px;
    margin-left: 6px;
  }
  .prompt-field input,
  .prompt-field textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    font-size: 14px;
    color: var(--fg);
    transition: all 0.15s;
    resize: vertical;
  }
  .prompt-field input:focus,
  .prompt-field textarea:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .prompt-field textarea {
    min-height: 70px;
    font-family: inherit;
  }

  .prompt-output {
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }
  .prompt-output-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .prompt-output-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
  }
  .btn-copy {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: var(--accent);
    color: white;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    transition: all 0.15s;
    min-height: 44px;
  }
  .btn-copy:hover {
    background: var(--accent-2);
    transform: translateY(-1px);
  }
  .btn-copy:active { transform: translateY(0); }
  .btn-copy.copied {
    background: var(--success);
  }
  .prompt-output-text {
    background: #0f172a;
    color: #e2e8f0;
    padding: 18px;
    border-radius: var(--radius);
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 400px;
    overflow-y: auto;
  }

  .steps {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 24px;
  }
  .step {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px 22px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
    transition: all 0.2s;
  }
  .step:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-sm);
  }
  .step-num {
    width: 32px; height: 32px;
    flex-shrink: 0;
    border-radius: 8px;
    background: var(--accent-soft);
    color: var(--accent-2);
    display: grid; place-items: center;
    font-weight: 700; font-size: 13px;
  }
  .step-content { flex: 1; min-width: 0; }
  .step-title {
    font-size: 15px; font-weight: 600; color: var(--fg);
    margin-bottom: 4px;
  }
  .step-desc {
    font-size: 14px; color: var(--fg-2); line-height: 1.55;
  }
  .step-desc a { font-weight: 500; }
  .step-desc code {
    background: var(--surface-2);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 14px;
  }
  .step-screenshot {
    margin-top: 12px;
    aspect-ratio: 16 / 9;
    background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
    border-radius: var(--radius);
    border: 1px dashed var(--border-strong);
    position: relative;
    overflow: hidden;
  }
  .step-screenshot::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg, transparent 48%, rgba(37,99,235,0.04) 49%, rgba(37,99,235,0.04) 51%, transparent 52%),
      linear-gradient(45deg, transparent 48%, rgba(37,99,235,0.04) 49%, rgba(37,99,235,0.04) 51%, transparent 52%);
    background-size: 16px 16px;
    z-index: 0;
  }
  .step-screenshot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    position: relative;
    z-index: 1;
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s;
  }
  .tab:hover { color: var(--fg); }
  .tab.active {
    color: var(--accent-2);
    border-bottom-color: var(--accent);
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .dict-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 16px;
    font-size: 14px;
  }
  .dict-table th, .dict-table td {
    padding: 12px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .dict-table th {
    background: var(--surface-2);
    font-weight: 600;
    font-size: 13px;
    color: var(--fg);
  }
  .dict-table td { color: var(--fg-2); }
  .dict-table tr:last-child td { border-bottom: none; }

  .compare-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 16px;
    font-size: 14px;
  }
  .compare-table th, .compare-table td {
    padding: 12px 14px;
    text-align: left;
    border: 1px solid var(--border);
  }
  .compare-table th {
    background: var(--surface-2);
    font-weight: 600;
    font-size: 13px;
  }
  .compare-table th:first-child { background: var(--accent-soft); color: var(--accent-2); }
  .compare-table td:first-child { font-weight: 500; }

  .error-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
    margin-top: 20px;
  }
  .error-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--warn);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .error-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--warn);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .error-desc {
    font-size: 13.5px;
    color: var(--fg-2);
    line-height: 1.5;
  }
  .error-desc code {
    background: var(--surface-2);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 13.5px;
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 40px 0;
    margin-top: 40px;
    background: var(--surface);
  }
  .footer-inner {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: space-between;
    align-items: center;
  }
  .footer-text { font-size: 13px; color: var(--muted); }

  @media (max-width: 900px) {
    .pipeline {
      grid-template-columns: repeat(3, 1fr);
    }
    .pipeline::before { display: none; }
  }
  @media (max-width: 640px) {
    section { padding: 48px 0; }
    .hero { padding: 48px 0 24px; }
    .nav-inner { padding: 12px 16px; }
    .container { padding: 0 16px; }
    .nav-brand span.brand-text { display: none; }
    .nav-link { padding: 7px 10px; font-size: 12.5px; }
    .card { padding: 18px; }
    .pipeline { grid-template-columns: repeat(2, 1fr); }
    .example-grid { grid-template-columns: 1fr; }
    .compare-table { font-size: 12.5px; }
    .compare-table th, .compare-table td { padding: 8px 10px; }
    .dict-table { font-size: 12.5px; }
    .dict-table th, .dict-table td { padding: 8px 10px; }
  }
  @media (max-width: 400px) {
    .pipeline { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="progress-bar" id="progressBar"></div>

<nav class="nav" aria-label="Основная навигация">
  <div class="nav-inner">
    <div class="nav-brand">
      <div class="nav-logo">М</div>
      <span class="brand-text">Мастер-класс · ГенИИ</span>
    </div>
    <div class="nav-links" id="navLinks"></div>
  </div>
</nav>

<main id="app"></main>

<footer>
  <div class="container footer-inner">
    <div class="footer-text">ТПГ «ГенИИ» · ЧОУ «ОК Точка будущего» · 2026/2027</div>
    <div class="footer-text">Масликов М.М., учитель информатики</div>
  </div>
</footer>

<script>
  // ====== DATA ======
  const NAV = [
    { id: 'hero', label: 'Введение' },
    { id: 'plan', label: 'План' },
    { id: 'examples', label: 'Примеры' },

    { id: 'qwen', label: 'Qwen' },
    { id: 'deploy', label: 'Деплой' },
    { id: 'errors', label: 'Ошибки' }
  ];

  const EXAMPLES = [
    { title: 'Сайт подготовки к ЕГЭ', url: 'https://mmmaslikov.github.io/ege1/', img: 'images/ege.png' },
    { title: 'Сайт подготовки к ОГЭ', url: 'https://mmmaslikov.github.io/oge1/', img: 'images/oge.png' },

    { title: 'Урок «Сжатие данных» (11 класс)', url: 'https://mmmaslikov.github.io/datacompression11/', img: 'images/compression.png' },

    { title: 'Своя игра (6 класс)', url: 'https://mmmaslikov.github.io/game6/', img: 'images/game.png' },
    { title: 'Презентация для урока (9 класс)', url: 'https://mmmaslikov.github.io/datamirrorpp/', img: 'images/presentation.png' },
    { title: 'Паспорт ТПГ «ГенИИ»', url: 'https://mmmaslikov.github.io/tpg/', img: 'images/tpg.png' }
  ];

  const QWEN_STEPS = [
    {
      num: '01',
      title: 'Откройте Qwen и зарегистрируйтесь',
      desc: 'Перейдите по адресу <a href="https://chat.qwen.ai/" target="_blank" rel="noopener">chat.qwen.ai</a> и создайте аккаунт. Подойдёт почта или вход через Google.',
      img: 'images/qwen-register.png'
    },
    {
      num: '02',
      title: 'Выберите режим «Веб-разработка» или «Артефакты»',
      desc: 'Нажмите кнопку «+» в интерфейсе чата и выберите режим, подходящий для генерации кода.',
      img: 'images/qwen-mode.png'
    },
    {
      num: '03',
      title: 'Добавьте задачу',
      desc: 'При необходимости прикрепите файл с материалами или описанием темы.',
      img: null
    },

  // ====== HELPERS ======
  function el(tag, attrs, children) {
    attrs = attrs || {};
    children = children || [];
    const node = document.createElement(tag);
    const keys = Object.keys(attrs);
    for (let i = 0; i < keys.length; i++) {
      const k = keys[i];
      const v = attrs[k];
      if (k === 'class') node.className = v;
      else if (k === 'html') node.innerHTML = v;
      else if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null) node.setAttribute(k, v);
    }
    const flat = [].concat(children);
    for (let i = 0; i < flat.length; i++) {
      const c = flat[i];
      if (c == null) continue;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return node;
  }

  function copyPrompt() {
    const text = document.getElementById('promptOutput') ? document.getElementById('promptOutput').textContent : '';
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() {
        showCopied();
      }).catch(function() {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showCopied(); } catch(e) { alert('Не удалось скопировать. Выделите текст вручную.'); }
    document.body.removeChild(ta);
  }

  function showCopied() {
    const btn = document.getElementById('copyBtn');
    const icon = document.getElementById('copyIcon');
    const txt = document.getElementById('copyText');
    if (!btn) return;
    btn.classList.add('copied');
    if (icon) icon.innerHTML = ICONS.check;
    if (txt) txt.textContent = 'Скопировано!';
    setTimeout(function() {
      btn.classList.remove('copied');
      if (icon) icon.innerHTML = ICONS.copy;
      if (txt) txt.textContent = 'Копировать';
    }, 2000);
  }

  function renderQwen() {
    const steps = el('div', { class: 'steps' });
    QWEN_STEPS.forEach(function(s) {
      const content = el('div', { class: 'step-content' }, [
        el('div', { class: 'step-title' }, s.title),
        el('div', { class: 'step-desc', html: s.desc })
      ]);
      if (s.img) {
        content.appendChild(el('div', { class: 'step-screenshot' }, [
          el('img', { src: s.img, alt: s.title, style: 'width:100%;height:100%;object-fit:cover;' })
        ]));
      }
      steps.appendChild(el('div', { class: 'step' }, [
        el('div', { class: 'step-num' }, s.num),
        content
      ]));
    });
    return el('section', { id: 'qwen' }, [
      el('div', { class: 'container' }, [
        sectionHead('Блок 04', 'Qwen: пошаговая инструкция', 'Девять шагов от регистрации до готового HTML-кода.'),
        steps
      ])
    ]);
  }

  function renderDeploy() {
    const intro = el('div', { class: 'card' });
    intro.appendChild(el('div', { style: 'font-size:15px;font-weight:600;color:var(--fg);margin-bottom:10px' }, 'Что нужно понять перед началом'));
    const ul = el('ul', { style: 'margin:0;padding-left:18px;color:var(--fg-2);font-size:14.5px;line-height:1.6' });
    ul.appendChild(el('li', {}, [el('strong', {}, 'index.html'), ' — точка входа. Именно этот файл откроется, когда кто-то перейдёт по ссылке. Назовите главный файл именно так.']));
    ul.appendChild(el('li', {}, [el('strong', {}, 'Относительные пути'), ' — если у вас несколько файлов, создавайте папки, указывая в названии файла их имя: ', el('code', {}, 'images/foto.png'), '.']));
    ul.appendChild(el('li', {}, [el('strong', {}, 'Публичность'), ' — бесплатный Pages доступен для публичных репозиториев. Не выкладывайте ничего личного: страницу увидит весь интернет.']));
    intro.appendChild(ul);

    const dictCard = el('div', { class: 'card' });
    dictCard.appendChild(el('div', { style: 'font-size:15px;font-weight:600;color:var(--fg);margin-bottom:10px' }, 'Словарь на пять минут'));
    const dictTable = el('table', { class: 'dict-table' });
    dictTable.appendChild(el('thead', {}, [
      el('tr', {}, [
        el('th', {}, 'Термин'),
        el('th', {}, 'Что это'),
        el('th', {}, 'Аналогия для учителя')
      ])
    ]));
    const dictBody = el('tbody');
    [
      ['Репозиторий', 'Папка проекта с историей изменений', 'Папка с работами ученика + журнал правок'],
      ['Коммит', 'Сохранённая версия изменений', '«Сохранить как» с комментарием, что изменилось'],
      ['Ветка (main)', 'Основная линия версий проекта', 'Чистовик (черновики — другие ветки)'],
      ['Pages', 'Бесплатный хостинг статики из репозитория', 'Вывесить чистовик на школьную стену']
    ].forEach(function(row) {
      dictBody.appendChild(el('tr', {}, row.map(function(cell) { return el('td', {}, cell); })));
    });
    dictTable.appendChild(dictBody);
    dictCard.appendChild(dictTable);

    const tabs = el('div', { class: 'tabs' });
    const tabGh = el('button', { class: 'tab active', 'data-tab': 'github' }, 'GitHub Pages');
    const tabGv = el('button', { class: 'tab', 'data-tab': 'gitverse' }, 'GitVerse Pages');
    tabs.appendChild(tabGh);
    tabs.appendChild(tabGv);

    const ghPanel = el('div', { class: 'tab-panel active', id: 'panel-github' });
    const ghSteps = el('div', { class: 'steps' });
    GITHUB_STEPS.forEach(function(s) {
      const content = el('div', { class: 'step-content' }, [
        el('div', { class: 'step-title' }, s.title),
        el('div', { class: 'step-desc', html: s.desc })
      ]);
      if (s.img) {
        content.appendChild(el('div', { class: 'step-screenshot' }, [
          el('img', { src: s.img, alt: s.title, style: 'width:100%;height:100%;object-fit:cover;' })
        ]));
      }
      ghSteps.appendChild(el('div', { class: 'step' }, [
        el('div', { class: 'step-num' }, s.num),
        content
      ]));
    });
    ghPanel.appendChild(ghSteps);

    const gvPanel = el('div', { class: 'tab-panel', id: 'panel-gitverse' });
    const gvSteps = el('div', { class: 'steps' });
    GITVERSE_STEPS.forEach(function(s) {
      gvSteps.appendChild(el('div', { class: 'step' }, [
        el('div', { class: 'step-num' }, s.num),
        el('div', { class: 'step-content' }, [
          el('div', { class: 'step-title' }, s.title),
          el('div', { class: 'step-desc', html: s.desc })
        ])
      ]));
    });
    gvPanel.appendChild(gvSteps);

    const compareCard = el('div', { class: 'card' });
    compareCard.appendChild(el('div', { style: 'font-size:15px;font-weight:600;color:var(--fg);margin-bottom:10px' }, 'GitHub vs GitVerse — что выбрать'));
    const cmpTable = el('table', { class: 'compare-table' });
    cmpTable.appendChild(el('thead', {}, [
      el('tr', {}, [
        el('th', {}, 'Параметр'),
        el('th', {}, 'GitHub Pages'),
        el('th', {}, 'GitVerse Pages')
      ])
    ]));
    const cmpBody = el('tbody');
    [
      ['Адрес сайта', 'ник.github.io/репо', 'ник.gitverse.site/репо'],
      ['Регистрация', 'почта', 'почта или Сбер ID'],
      ['Включение', 'Settings → Pages → Deploy from a branch', 'Настройки → Страницы → источник «Ветка»'],
      ['Ограничения', 'только статика', 'только статика; относительные пути'],
      ['Кому удобен', 'всем, крупнейшее комьюнити', 'тем, кто работает в российском контуре']
    ].forEach(function(row) {
      cmpBody.appendChild(el('tr', {}, row.map(function(cell) { return el('td', {}, cell); })));
    });
    cmpTable.appendChild(cmpBody);
    compareCard.appendChild(cmpTable);

    return el('section', { id: 'deploy' }, [
      el('div', { class: 'container' }, [
        sectionHead('Блок 05', 'GitHub и GitVerse', 'Файл на вашем компьютере видите только вы. Деплой превращает его в ссылку, которую можно отправить, показать на проекторе или зашить в QR-код.'),
        intro,
        dictCard,
        tabs,
        ghPanel,
        gvPanel,
        compareCard
      ])
    ]);
  }

  function renderErrors() {
    const grid = el('div', { class: 'error-grid' });
    ERRORS.forEach(function(e) {
      grid.appendChild(el('div', { class: 'error-card' }, [
        el('div', { class: 'error-title', html: ICONS.warn + ' ' + e.title }),
        el('div', { class: 'error-desc', html: e.desc })
      ]));
    });
    return el('section', { id: 'errors' }, [
      el('div', { class: 'container' }, [
        sectionHead('Блок 06', 'Частые ошибки и как их чинить', 'Четыре типичные проблемы и их решения. Сохраните этот блок — он пригодится на практике.'),
        grid
      ])
    ]);
  }

  function render() {
    const app = document.getElementById('app');
    app.innerHTML = '';
    app.appendChild(renderHero());
    app.appendChild(renderPlan());
    app.appendChild(renderExamples());
    app.appendChild(renderPrompt());
    app.appendChild(renderQwen());
    app.appendChild(renderDeploy());
    app.appendChild(renderErrors());

    setTimeout(updatePromptOutput, 50);
  }

  // ====== HANDLERS ======
  function setupTabs() {
    document.querySelectorAll('.tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        const target = tab.getAttribute('data-tab');
        document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
        tab.classList.add('active');
        const panel = document.getElementById('panel-' + target);
        if (panel) panel.classList.add('active');
      });
    });
  }

  function setupScrollSpy() {
    const sections = NAV.map(function(n) { return document.getElementById(n.id); }).filter(Boolean);
    const links = document.querySelectorAll('.nav-link');
    const io = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) {
        if (e.isIntersecting) {
          const id = e.target.id;
          links.forEach(function(l) {
            l.classList.toggle('active', l.getAttribute('data-nav') === id);
          });
        }
      });
    }, { rootMargin: '-40% 0px -55% 0px', threshold: 0 });
    sections.forEach(function(s) { io.observe(s); });
  }

  function setupProgress() {
    const bar = document.getElementById('progressBar');
    const onScroll = function() {
      const h = document.documentElement;
      const scrolled = h.scrollTop / (h.scrollHeight - h.clientHeight);
      bar.style.width = Math.min(100, Math.max(0, scrolled * 100)) + '%';
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  // ====== INIT ======
  function init() {
    renderNav();
    render();
    setupTabs();
    setupScrollSpy();
    setupProgress();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
</script>
